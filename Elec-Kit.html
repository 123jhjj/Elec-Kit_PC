  <style>
    :root {
      --red: #E1002A;
      --dark: #111214;
      --darker: #0a0b0d;
      --card-bg: #1a1c20;
      --card-border: #2a2d33;
      --text-primary: #f0f2f5;
      --text-secondary: #8a8f9a;
      --text-muted: #555a66;
      --input-bg: #12141a;
      --input-border: #2e323c;
      --result-bg: #1f0a0d;
      --result-border: #5a1020;
      --formula-bg: #13151a;
      --header-bg: #141618;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --dark: #f4f6f8;
        --darker: #e8eaed;
        --card-bg: #ffffff;
        --card-border: #e0e4e8;
        --text-primary: #111214;
        --text-secondary: #555a66;
        --text-muted: #9aa0ae;
        --input-bg: #fafbfc;
        --input-border: #d0d5dd;
        --result-bg: #fff5f5;
        --result-border: #ffcfcf;
        --formula-bg: #f8f9fa;
        --header-bg: #fafafa;
      }
    }

    * { font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
    html, body { touch-action: pan-x pan-y; }
    body { background: var(--dark); color: var(--text-primary); -webkit-text-size-adjust: none; }

    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      background: var(--darker);
      border-bottom: 1px solid var(--card-border);
      display: flex; align-items: flex-end;
      padding: env(safe-area-inset-top, 36px) 20px 12px 20px;
      min-height: calc(52px + env(safe-area-inset-top, 36px));
    }
    .top-bar-title { font-size: 1.1rem; font-weight: 900; color: var(--red); letter-spacing: -0.03em; }

    #main-menu {
      min-height: 100vh;
      padding: calc(env(safe-area-inset-top, 36px) + 88px) 20px 40px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .menu-header { text-align: center; margin-bottom: 2.5rem; }
    .menu-header h1 { font-size: 3rem; font-weight: 900; color: var(--red); letter-spacing: -0.05em; line-height: 1; }
    .menu-header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 8px; }
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 480px; }
    .menu-btn {
      padding: 18px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 0.92rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
      text-align: left; position: relative; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .menu-btn::before {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: var(--red);
      transform: scaleX(0); transform-origin: left;
      transition: transform 0.2s;
    }
    .menu-btn:hover { border-color: var(--red); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(225,0,42,0.15); }
    .menu-btn:hover::before { transform: scaleX(1); }
    .menu-btn .btn-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; display: block; font-weight: 400; }

    #content-area { display: none; padding-top: calc(env(safe-area-inset-top, 36px) + 52px); }
    .nav-bar {
      position: sticky; top: calc(env(safe-area-inset-top, 36px) + 52px); z-index: 100;
      background: var(--darker);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 20px;
      display: flex; align-items: center; gap: 12px;
    }
    .back-link {
      color: var(--red); font-weight: 700; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      font-size: 0.9rem; padding: 6px 10px;
      border-radius: 6px; border: 1px solid var(--card-border);
      transition: all 0.2s;
    }
    .back-link:hover { background: rgba(225,0,42,0.1); border-color: var(--red); }
    .nav-title { font-size: 1rem; font-weight: 700; color: var(--text-primary); }

    #calc-wrapper { padding: 24px 12px 40px; margin-top: 0; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--card-border); margin-bottom: 20px; overflow: hidden; }
    .card-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: var(--header-bg); border-bottom: 1px solid var(--card-border); }
    .card-header h2 { margin: 0; font-size: 1rem; font-weight: 700; color: var(--text-primary); }
    .card-body { padding: 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; }

    table { width: 100%; border-collapse: collapse; border: 1px solid var(--card-border); table-layout: auto; }
    th { background: var(--header-bg); color: var(--text-secondary); font-size: 0.8rem; padding: 10px 4px; border: 1px solid var(--card-border); white-space: nowrap; vertical-align: middle; text-align: center; }
    td { padding: 8px 4px; border: 1px solid var(--card-border); text-align: center; vertical-align: middle; }
    .category { color: var(--text-primary); font-weight: 700; font-size: 0.78rem; white-space: nowrap; padding: 8px 6px; }

    .calc-block { width: 100%; }

    .input-row {
      display: flex; flex-wrap: nowrap; gap: 6px;
      width: 100%; margin-bottom: 0;
    }
    .input-col {
      flex: 1 1 0; min-width: 0;
      display: flex; flex-direction: column; gap: 4px;
    }
    .input-col label {
      font-size: 0.72rem; color: var(--text-secondary);
      text-align: center; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      line-height: 1.3;
    }
    .input-col input {
      width: 100%; height: 36px; padding: 0 4px;
      background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 6px;
      color: var(--text-primary); text-align: center; font-size: 0.88rem; font-weight: 500;
      font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif; transition: border-color 0.2s, font-size 0.15s;
      box-sizing: border-box; min-width: 0;
    }
    .input-col input::placeholder { color: var(--text-muted); font-size: 0.75rem; }
    .input-col input:focus { border-color: var(--red); outline: none; }

    .result-row {
      display: flex; align-items: stretch;
      border: 1px solid var(--card-border);
      border-radius: 0 0 8px 8px;
      margin-top: 6px; overflow: hidden;
      min-height: 40px;
    }
    .result-label {
      background: var(--header-bg);
      color: var(--text-secondary);
      font-size: 0.75rem; font-weight: 700;
      padding: 0 10px;
      display: flex; align-items: center; justify-content: center;
      white-space: nowrap;
      border-right: 1px solid var(--card-border);
      flex-shrink: 0;
      width: auto;
    }

    .result-value {
      flex: 1;
      background: var(--result-bg); color: var(--red);
      font-weight: 800; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      min-height: 40px; min-width: 0;
      overflow: visible;
      font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
      transition: font-size 0.1s;
      padding: 0 6px;
      white-space: nowrap;
    }
    .result-value.result-ok { color: #10b981 !important; background: rgba(16,185,129,0.08) !important; }

    .input-cell input {
      width: 90%; max-width: 80px; min-width: 46px;
      height: 36px; padding: 0;
      background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 6px;
      color: var(--text-primary); text-align: center; font-size: 0.9rem; font-weight: 500;
      display: block; margin: 0 auto;
      font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif; transition: border-color 0.2s;
    }
    .input-cell input::placeholder { color: var(--text-muted); font-size: 0.78rem; font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif; }
    .input-cell input:focus { border-color: var(--red); outline: none; }
    .result-cell {
      background: var(--result-bg); color: var(--red); font-weight: 800; font-size: 0.95rem;
      border: 1px solid var(--result-border) !important;
      height: 36px; line-height: 36px;
      font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif; min-width: 60px;
    }
    .result-ok { color: #10b981 !important; background: rgba(16,185,129,0.08) !important; border-color: #065f46 !important; }

    .formula {
      background: var(--formula-bg);
      border-left: 3px solid var(--red);
      padding: 12px 14px; margin-top: 14px;
      font-size: 0.82rem; color: var(--text-secondary);
      border-radius: 0 6px 6px 0;
    }
    .fml-line {
      display: flex; align-items: center; flex-wrap: nowrap; gap: 4px;
      margin-bottom: 6px; line-height: 1.6;
    }
    .fml-line:last-child { margin-bottom: 0; }
    .fml-label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.82rem;
      line-height: 1.6;
    }
    .fml-frac-row {
      display: flex; justify-content: flex-start; align-items: center;
      font-size: 0.82rem; overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }
    .frac {
      display: inline-flex; flex-direction: column; align-items: stretch;
      vertical-align: middle; margin: 0 3px; text-align: center;
      flex-shrink: 0;
    }
    .frac .num {
      border-bottom: 1.5px solid var(--text-secondary);
      padding: 1px 4px 3px; text-align: center; white-space: nowrap; line-height: 1.6;
    }
    .frac .num.wrap { white-space: normal; }
    .frac .den { padding: 3px 4px 1px; text-align: center; white-space: nowrap; }

    .tab-btn,.seg-btn{
      flex:1;min-width:0;
      padding:10px 4px;background:var(--input-bg);border:1px solid var(--input-border);
      color:var(--text-secondary);font-weight:700;font-size:0.82rem;
      cursor:pointer;border-radius:8px;transition:all 0.2s;
      font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;
      text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn.active,.seg-btn.active{background:var(--red);color:white;border-color:var(--red);}
    .tab-container{display:flex;flex-wrap:nowrap;gap:6px;margin-bottom:14px;width:100%;}
    .tab-container.tabs-3 .tab-btn{font-size:0.82rem!important;padding:10px 4px!important;}
    .tab-container.tabs-vd{flex-wrap:wrap!important;}
    .tab-container.tabs-vd .tab-btn{flex:1 1 calc(50% - 3px)!important;max-width:calc(50% - 3px)!important;font-size:0.82rem!important;padding:10px 4px!important;white-space:nowrap!important;}
    .amp-display-table{display:none;margin-top:10px;table-layout:fixed!important;width:100%!important;}
    .amp-display-table.active{display:table;}
    .seg-group{display:flex;flex-wrap:nowrap;gap:6px;margin-bottom:14px;width:100%;}

    .tab-btn:active, .seg-btn:active {
      transform: scale(0.96);
      opacity: 0.8;
      transition: transform 0.08s, opacity 0.08s;
    }
    .menu-btn:active, .menu-btn.pressing {
      transform: scale(0.96);
      border-color: var(--red);
      box-shadow: 0 4px 16px rgba(225,0,42,0.25);
      opacity: 0.85;
      transition: transform 0.08s, opacity 0.08s, box-shadow 0.08s;
    }
    .menu-btn.pressing::before { transform: scaleX(1); }

    .card-header h2 { flex: 1; }

    .btn-reset,.btn-copy,.btn-save{
      font-size:0.72rem;font-weight:700;color:var(--text-muted);
      background:none;border:1px solid var(--card-border);
      border-radius:5px;padding:4px 9px;cursor:pointer;
      font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;
      transition:color 0.15s,border-color 0.15s;
      white-space:nowrap;flex-shrink:0;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-copy,.btn-save{margin-left:6px;}
    .btn-reset:active,.btn-copy:active,.btn-save:active{transform:scale(0.95);}
    .btn-reset:hover,.btn-copy:hover{color:var(--red);border-color:var(--red);}
    .btn-save:hover{color:#10b981;border-color:#10b981;}
    .p7-lbl { width:140px;min-width:140px;justify-content:center; }
    .p6-lbl { width:100px;min-width:100px; }
    .p8-lw { min-width:125px;width:125px;justify-content:center;padding:0 8px;font-size:0.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .p8-elw { min-width:130px;width:130px;flex-shrink:0;justify-content:center;padding:0 6px;font-size:0.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .p8-whlw { min-width:130px;width:130px;justify-content:center;padding:0 6px;font-size:0.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    select.p8-sel { width:100%;height:36px;padding:0 4px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:6px;color:var(--text-primary);font-size:0.8rem;cursor:pointer; }
    .p8-dd { position:relative; }
    .p8-dd-btn { width:100%;height:36px;padding:0 10px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:6px;color:var(--text-primary);font-size:0.8rem;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:4px;font-family:inherit; }
    .p8-dd-arrow { flex-shrink:0;transition:transform .15s;color:var(--text-muted); }
    .p8-dd-btn.open .p8-dd-arrow { transform:rotate(180deg); }
    .p8-dd-list { position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:50;background:var(--card-bg);border:1px solid var(--card-border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.25);max-height:220px;overflow-y:auto; }
    .p8-dd-opt { padding:9px 10px;font-size:0.8rem;color:var(--text-primary);cursor:pointer; }

function v(id) {
  const el = document.getElementById(id);
  if (!el) return 0;
  const val = el.value;
  if (val===''||val===null) return 0;
  const n = Number(val);
  return (isNaN(n) || n < 0) ? 0 : n;
}
function vPf(id) {
  const el = document.getElementById(id);
  if (!el) return 1;
  if (el.value === '' || el.value === null) return 1;
  let n = Number(el.value);
  if (isNaN(n) || n <= 0) return 0;
  if (n > 100) n = 100;
  return n / 100;
}
function fmtNum(num, decimals) {
  if (isNaN(num) || !isFinite(num)) return '-';
  if (decimals === undefined) decimals = 0;
  const fixed = num.toFixed(decimals);
  const parts = fixed.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return parts.join('.');
}
function set(id, val) {
  const el = document.getElementById(id);
  if (!el) return;
  let text;
  if (val === '-' || val === null || val === undefined) {
    text = '-';
  } else {
    const num = Number(String(val).replace(/,/g, ''));
    text = (isNaN(num) || !isFinite(num)) ? '-' : String(val);
  }
  // 무관한 입력이 바뀌어도 계산 함수가 이 결과값까지 통째로 다시 계산해서 쓰는 경우가
  // 많은데, 결과가 이전과 똑같으면 DOM에 다시 쓰고 autoShrinkEl(캔버스 텍스트 측정)까지
  // 다시 돌릴 필요가 없다. 값이 실제로 달라졌을 때만 갱신한다.
  if (el.textContent === text) return;
  el.textContent = text;
  autoShrinkEl(el);
}

const _sc = document.createElement('canvas').getContext('2d');

const INPUT_BASE_PX  = 14.08;
const RESULT_BASE_PX = 16;
const INPUT_MIN_PX   = INPUT_BASE_PX  * 0.52;
const RESULT_MIN_PX  = RESULT_BASE_PX * 0.45;

function _measureText(text, weight, sizePx, font) {
  _sc.font = `${weight} ${sizePx}px "${font}", sans-serif`;
  return _sc.measureText(text).width;
}

// 글자 크기를 base에서 0.5px씩 줄여가며 매번 measureText로 재보는 대신, 같은 후보
// 크기 집합(base, base-0.5, base-1, ...)에 대해 이분 탐색으로 찾는다. 글자가 작아질수록
// 폭도 단조 감소하므로 선형 탐색과 정확히 같은 크기를 고르면서 측정 횟수만 줄어든다.
function _findShrinkSize(measureAt, base, min, maxW) {
  if (measureAt(base) <= maxW) return base;
  const maxSteps = Math.ceil((base - min) / 0.5);
  let lo = 1, hi = maxSteps, best = maxSteps;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    const size = base - mid * 0.5;
    if (measureAt(size) <= maxW) {
      best = mid;
      hi = mid - 1;
    } else {
      lo = mid + 1;
    }
  }
  return base - best * 0.5;
}

function autoShrinkInput(inp) {
  if (!inp) return;
  const maxW = inp.clientWidth - 10;
  if (maxW <= 0) {
    if (inp.offsetParent === null) return;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ autoShrinkInput(inp); }); });
    return;
  }
  const val = inp.value || '';
  const size = _findShrinkSize(
    function(s) { return _measureText(val, '500', s, 'Malgun Gothic'); },
    INPUT_BASE_PX, INPUT_MIN_PX, maxW
  );
  inp.style.fontSize = size + 'px';
}

function autoShrinkEl(el) {
  if (!el) return;
  const avail = el.offsetWidth - 12;
  if (avail <= 0) {
    if (el.offsetParent === null) return;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ autoShrinkEl(el); }); });
    return;
  }
  const text = el.textContent || '';
  const size = _findShrinkSize(
    function(s) { return _measureText(text, '800', s, 'Malgun Gothic'); },
    RESULT_BASE_PX, RESULT_MIN_PX, avail
  );
  el.style.fontSize = size + 'px';
}

document.addEventListener('input', function(e) {
  if (e.target && e.target.matches('.input-col input')) autoShrinkInput(e.target);
});

function initShrinkAll() {
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    document.querySelectorAll('#dynamic-content .input-col input').forEach(autoShrinkInput);
  });});
}

function resetCard(cardId) {

  card.querySelectorAll('input').forEach(function(inp) {
    const def = inp.getAttribute('value');

    autoShrinkInput(inp);

  card.querySelectorAll('.result-value').forEach(function(el) {
    el.textContent = '-'; el.className='result-value'; el.style.color=''; autoShrinkEl(el);

  }
}

let vdType='bat', sqType='bat', lenType='bat';
const VD_K={dc2:35.6,ac1:35.6,ac3:30.8,ac4:17.8};
const SQ_K={bat:35.6,dc2:35.6,ac1:35.6,ac3:30.8,ac4:17.8};
const LEN_K={bat:35.6,dc:35.6,ac1:35.6,ac3:30.8,ac4:17.8};
const CAT={bat:'축전지DC',dc2:'DC',ac1:'AC 단상',ac3:'AC 3상 3선',ac4:'AC 3상 4선',dc:'DC'};

function initP1(){vdType='bat';sqType='bat';lenType='bat';updateVdFormula();}

function updateVdFormula(){
  const fd=document.getElementById('vd-formula');
  if(!fd) return;
  const k=VD_K[vdType]??35.6;
  fd.innerHTML=`<div class="fml-label">○ 전압강하[V] =</div>
    <div class="fml-frac-row">
      <span class="frac">
        <span class="num">${k} × 길이[m] × 부하[A]</span>
        <span class="den">1,000 × 단면적[mm²]</span>
      </span>
    </div>`;
}

function setVdType(t,btn){
  vdType=t;
  document.querySelectorAll('#vd-tabs .tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const isBat=(t==='bat');
  document.getElementById('vd-bat-row').style.display=isBat?'':'none';
  document.getElementById('vd-common-row').style.display=isBat?'none':'';
  if(!isBat){updateVdFormula();}
  u1();
}
function setSqType(t,btn){
  sqType=t;
  document.querySelectorAll('#sq-tabs .tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const isBat=(t==='bat');
  const kKey=isBat?'dc2':t;
  const k=SQ_K[kKey]??35.6;
  const fd=document.getElementById('sq-formula');
  if(fd){
    if(isBat){
      fd.innerHTML=`<div class="fml-label">○ 단면적[mm²] =</div>
        <div class="fml-frac-row"><span class="frac"><span class="num"><span id="sq-k-disp">${k}</span> × 길이[m] × 부하[A] × 1.125</span><span class="den">1,000 × 허용 전압강하[V]</span></span></div>
        <div class="fml-label" style="margin-top:6px">○ 허용 전압강하 기본값 : 0.5V</div>`;
    } else {
      fd.innerHTML=`<div class="fml-label">○ 단면적[mm²] =</div>
        <div class="fml-frac-row"><span class="frac"><span class="num"><span id="sq-k-disp">${k}</span> × 길이[m] × 부하[A]</span><span class="den">1,000 × 허용 전압강하[V]</span></span></div>
        <div class="fml-label" style="margin-top:6px">○ 허용 전압강하 기본값 : 0.5V</div>`;
    }
  }
  u1();
}
function setLenType(t,btn){
  lenType=t;
  document.querySelectorAll('#len-tabs .tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const isBat=(t==='bat');
  const kKey=isBat?'dc':t;
  const k=LEN_K[kKey]??35.6;
  const fd=document.getElementById('len-formula');
  if(fd){
    if(isBat){
      fd.innerHTML=`<div class="fml-label">○ 길이[m] =</div>
        <div class="fml-frac-row"><span class="frac"><span class="num">1,000 × 허용 전압강하[V] × 단면적[mm²]</span><span class="den"><span id="len-k-disp">${k}</span> × 부하[A] × 1.125</span></span></div>`;
    } else {
      fd.innerHTML=`<div class="fml-label">○ 길이[m] =</div>
        <div class="fml-frac-row"><span class="frac"><span class="num">1,000 × 허용 전압강하[V] × 단면적[mm²]</span><span class="den"><span id="len-k-disp">${k}</span> × 부하[A]</span></span></div>`;
    }
  }
  u1();
}
function tabAmp(targetId,btn){
  document.querySelectorAll('.amp-display-table').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('#amp-tabs .tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(targetId).classList.add('active');
  btn.classList.add('active');
}

function u1(){
  if(vdType==='bat'){
    const l=v('bat_l'),i=v('bat_i'),s=v('bat_s'),n=v('bat_n')||1;
    const batR=(s>0&&n>0)?(35.6*l*i*1.125/(1000*s*n)):0;
    const batEl=document.getElementById('bat_r');
    if(batEl){
      const hasInput=l>0&&i>0&&s>0;
      if(hasInput){batEl.textContent=fmtNum(batR,3);batEl.className='result-value'+(batR<=0.5?' result-ok':'');}
      else{batEl.textContent='-';batEl.className='result-value';}
      autoShrinkEl(batEl);
    }
  } else {
    const k=VD_K[vdType]??35.6,l=v('vd_l'),i=v('vd_i'),s=v('vd_s');
    const vdR=s>0?(k*l*i/(1000*s)):0;
    const vdEl=document.getElementById('vd_r');
    if(vdEl){
      const hasInput=l>0&&i>0&&s>0;
      if(hasInput){vdEl.textContent=fmtNum(vdR,3);vdEl.className='result-value'+(vdR<=0.5?' result-ok':'');}
      else{vdEl.textContent='-';vdEl.className='result-value';}
      autoShrinkEl(vdEl);
    }
  }
  if(sqType==='bat'){
    const kSq=SQ_K.dc2,sl=v('sq_l'),si=v('sq_i'),se=v('sq_e');
    const sqR=se>0?(kSq*sl*si*1.125/(1000*se)):0;
    set('sq_r',(sl>0&&si>0&&se>0)?fmtNum(sqR,2):'-');
  } else {
    const kSq=SQ_K[sqType]??35.6,sl=v('sq_l'),si=v('sq_i'),se=v('sq_e');
    const sqR=se>0?(kSq*sl*si/(1000*se)):0;
    set('sq_r',(sl>0&&si>0&&se>0)?fmtNum(sqR,2):'-');
  }
  if(lenType==='bat'){
    const kLen=LEN_K.dc,le=v('len_e'),ls=v('len_s'),li=v('len_i');
    const lenR=li>0?(1000*le*ls/(kLen*li*1.125)):0;
    set('len_r',(ls>0&&li>0)?fmtNum(lenR,2):'-');
  } else {
    const kLen=LEN_K[lenType]??35.6,le=v('len_e'),ls=v('len_s'),li=v('len_i');
    const lenR=li>0?(1000*le*ls/(kLen*li)):0;
    set('len_r',(ls>0&&li>0)?fmtNum(lenR,2):'-');
  }
}

function u3(){

  const sm1=m1>0?fmtNum(m1,3):'-',sh1=m1>0?fmtNum(m1/60,3):'-';
  set('m2v',sm1);set('h2v',sh1);
  const c2=v('c12va'),l2=v('ld12va'),m2=l2>0?((c2*1.5)/(l2*4.36))*60:0;
  const sm2=m2>0?fmtNum(m2,3):'-',sh2=m2>0?fmtNum(m2/60,3):'-';
  set('m12va',sm2);set('h12va',sh2);
  const c3=v('c12vb'),l3=v('ld12vb'),m3=l3>0?((c3*1.5)/(l3*5.55))*60:0;
  const sm3=m3>0?fmtNum(m3,3):'-',sh3=m3>0?fmtNum(m3/60,3):'-';

}
function u4(){
  const r=v('rp'),s=v('sp'),t=v('tp');
  const rpEl=document.getElementById('rp'),spEl=document.getElementById('sp'),tpEl=document.getElementById('tp');

  const apEl=document.getElementById('ap'),upEl=document.getElementById('up');
  if(!allInput){
    if(apEl){apEl.textContent='-';apEl.style.color='';autoShrinkEl(apEl);}
    if(upEl){upEl.textContent='-';upEl.className='result-value';upEl.style.color='';autoShrinkEl(upEl);}
    return;
  }
  const avg=(r+s+t)/3,max=Math.max(r,s,t),min=Math.min(r,s,t);
  set('ap',avg>0?fmtNum(avg,2):'-');
  const unb=avg>0?(((max-min)/avg)*100):0;
  if(upEl){const su=avg>0?fmtNum(unb,2):'-';upEl.textContent=su;upEl.className='result-value';upEl.style.color=avg>0?(unb>30?'var(--red)':'#10b981'):'';autoShrinkEl(upEl);}
}

    if(maxI>0&&vv>0&&el){const kw=1.732*vv*maxI*eff/1000;el.textContent=fmtNum(kw,3);autoShrinkEl(el);}
    else if(el){el.textContent='-';autoShrinkEl(el);}
  }
}

function u7(){
  const r=v('p7_r'),s=v('p7_s'),t=v('p7_t'),vv=v('p7_v'),pf=vPf('p7_pf'),area=v('p7_area');
  const kwEl=document.getElementById('p7_kw'),totalEl=document.getElementById('p7_total'),rtEl=document.getElementById('p7_rt');
  const maxI=Math.max(r,s,t);
  const kw=(maxI>0&&vv>0)?1.732*vv*maxI*pf/1000:0;
  if(kw>0||area>0){
    if(kwEl){kwEl.textContent=kw>0?fmtNum(kw,3):'-';autoShrinkEl(kwEl);}
    const total=(kw*860+area*130)*1.2;
    const rt=total/2500;
    if(totalEl){totalEl.textContent=fmtNum(total,0);autoShrinkEl(totalEl);}
    if(rtEl){rtEl.textContent=fmtNum(rt,2);autoShrinkEl(rtEl);}
  } else {
    if(kwEl){kwEl.textContent='-';autoShrinkEl(kwEl);}
    if(totalEl){totalEl.textContent='-';autoShrinkEl(totalEl);}
    if(rtEl){rtEl.textContent='-';autoShrinkEl(rtEl);}
  }
}

// Custom button+list dropdown, backed by a hidden <select> so existing code
// reading selectEl.value keeps working.
function p8DdHTML(id, items, selectedValue, onChangeCall) {
  const opts = items.map(it =>
    `<option value="${it.k}"${it.k === selectedValue ? ' selected' : ''}>${it.l}</option>`
  ).join('');
  const selectedItem = items.find(it => it.k === selectedValue) || items[0];
  const list = items.map(it =>
    `<div class="p8-dd-opt${it.k === selectedValue ? ' active' : ''}" data-value="${it.k}" onclick="p8DdChoose('${id}','${it.k}',function(){${onChangeCall}})">${it.l}</div>`
  ).join('');
  return `<div class="p8-dd" data-dd-id="${id}">
    <select id="${id}" class="p8-sel" hidden>${opts}</select>
    <button type="button" class="p8-dd-btn" id="${id}-btn" onclick="p8DdToggle('${id}')">
      <span id="${id}-label">${selectedItem ? selectedItem.l : ''}</span>
      <svg class="p8-dd-arrow" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="p8-dd-list" id="${id}-list" hidden>${list}</div>
  </div>`;
}

// Scroll the open dropdown list with the mouse wheel instead of the page
// behind it.
window.addEventListener('wheel', function(e) {
  const list = e.target.closest && e.target.closest('.p8-dd-list');
  if (list && !list.hidden) {
    e.preventDefault();
    e.stopPropagation();
    list.scrollTop += e.deltaY;
  }
}, { passive: false, capture: true });

function p8DdToggle(id) {
  document.querySelectorAll('.p8-dd-list').forEach(function(l) { if (l.id !== id + '-list') l.hidden = true; });
  document.querySelectorAll('.p8-dd-btn').forEach(function(b) { if (b.id !== id + '-btn') b.classList.remove('open'); });
  const list = document.getElementById(id + '-list');
  const btn = document.getElementById(id + '-btn');
  if (!list) return;
  list.hidden = !list.hidden;
  if (btn) btn.classList.toggle('open', !list.hidden);
}

function p8DdClose(id) {
  const list = document.getElementById(id + '-list');
  const btn = document.getElementById(id + '-btn');
  if (list) list.hidden = true;
  if (btn) btn.classList.remove('open');
}

function p8DdChoose(id, value, cb) {
  const sel = document.getElementById(id);
  if (sel) sel.value = value;
  const label = document.getElementById(id + '-label');
  const opt = sel && sel.querySelector('option[value="' + value + '"]');
  if (label && opt) label.textContent = opt.textContent;
  document.querySelectorAll('#' + id + '-list .p8-dd-opt').forEach(function(o) {
    o.classList.toggle('active', o.dataset.value === value);
  });
  p8DdClose(id);
  if (typeof cb === 'function') cb();
}

function p8Fmt(n) {
  if (!isFinite(n) || isNaN(n)) return '-';
  if (n === 0) return '0';
  const abs = Math.abs(n);
  if (abs < 1e-9 || abs >= 1e15) return n.toExponential(4);
  if (abs < 0.0001) return n.toExponential(4);
  if (abs < 1) { const s = parseFloat(n.toPrecision(5)).toString(); return s; }
  const mag = Math.floor(Math.log10(abs));
  const dec = Math.max(0, Math.min(6, 5 - mag));
  const s = fmtNum(n, dec);
  return s.includes('.') ? s.replace(/\.?0+$/, '') : s;
}

function p8CalcStd(cat) {
  const data = P8_CATS_DATA[cat]; if (!data) return;
  const valEl = document.getElementById('p8-val');
  const selEl = document.getElementById('p8-sel');
  if (!valEl || !selEl) return;
  const valStr = valEl.value;
  const fromKey = selEl.value;
  const fromUnit = data.units.find(u => u.k === fromKey);
  if (!fromUnit) return;
  const empty = (valStr === '' || valStr === null || isNaN(parseFloat(valStr)));
  data.units.forEach(u => {
    const el = document.getElementById('p8r_' + u.k); if (!el) return;
    if (empty) { el.textContent = '-'; el.style.color = ''; autoShrinkEl(el); return; }
    const val = parseFloat(valStr);
    const res = (val * fromUnit.f) / u.f;
    el.textContent = p8Fmt(res);
    el.style.color = (u.k === fromKey) ? 'var(--text-secondary)' : '';
    autoShrinkEl(el);
  });
}

function p8CalcTemp() {
  const valStr = document.getElementById('p8t-val')?.value;
  const from   = document.getElementById('p8t-sel')?.value;
  const ids = ['c','f','k'];
  const empty = (!valStr || isNaN(parseFloat(valStr)));
  if (empty) { ids.forEach(id=>{const e=document.getElementById('p8t-'+id);if(e){e.textContent='-';e.style.color='';autoShrinkEl(e);}}); return; }
  const val = parseFloat(valStr);
  let c = (from==='c') ? val : (from==='f') ? (val-32)*5/9 : val-273.15;
  const res = {c, f:c*9/5+32, k:c+273.15};
  ids.forEach(id => {
    const e = document.getElementById('p8t-'+id); if (!e) return;
    e.textContent = p8Fmt(res[id]);
    e.style.color = (id===from) ? 'var(--text-secondary)' : '';
    autoShrinkEl(e);
  });
}

  });
}
function p8ResetPhase() {
  p8PhaseMode='1';
  const a=document.getElementById('p8ph-a');   if(a)   a.value='';
  const vv=document.getElementById('p8ph-v');  if(vv)  vv.value='220';
  const pf=document.getElementById('p8ph-pf'); if(pf)  pf.value='100';
  const card=document.getElementById('card-p8-phase');
  if(card){
    card.querySelectorAll('.seg-group .seg-btn').forEach(function(b,i){
      b.classList.toggle('active', i===0);
    });
  }
  const fml=document.getElementById('p8ph-fml');
  if(fml){fml.textContent='○ 유효전력[kW] = 전압[V] × 전류[A] × (역률/100) ÷ 1,000';fml.className='fml-label fml-nowrap'}
  ['p8ph-kw','p8ph-kva'].forEach(function(id){
    const e=document.getElementById(id); if(e){e.textContent='-';e.style.color='';autoShrinkEl(e);}
  });
}

function p8SetPhase(mode, btn) {
  p8PhaseMode = mode;
  btn.closest('.seg-group').querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const vEl = document.getElementById('p8ph-v');
  if (vEl && (vEl.value==='220'||vEl.value==='380')) vEl.value = mode==='1' ? '220' : '380';
  const fml = document.getElementById('p8ph-fml');
  if (fml){fml.textContent = mode==='1' ? '○ 유효전력[kW] = 전압[V] × 전류[A] × (역률/100) ÷ 1,000' : '○ 유효전력[kW] = √3 × 전압[V] × 전류[A] × (역률/100) ÷ 1,000';fml.className='fml-label fml-nowrap';}
  p8CalcPhase();
}

function p8CalcWh() {
  const valStr = document.getElementById('p8w-val')?.value;
  const from   = document.getElementById('p8w-sel')?.value;
  const units  = [{k:'wh',f:1},{k:'kwh',f:1e3},{k:'mwh',f:1e6},{k:'gwh',f:1e9}];
  const empty  = (!valStr || isNaN(parseFloat(valStr)));
  if (empty) { units.forEach(u=>{const e=document.getElementById('p8w-'+u.k);if(e){e.textContent='-';e.style.color='';autoShrinkEl(e);}}); return; }
  const baseWh = parseFloat(valStr) * (units.find(u=>u.k===from)?.f||1);
  units.forEach(u => {
    const e = document.getElementById('p8w-'+u.k); if (!e) return;
    e.textContent = p8Fmt(baseWh / u.f);
    e.style.color = (u.k===from) ? 'var(--text-secondary)' : '';
    autoShrinkEl(e);
  });
}

function p8CalcElec() {
  const valStr = document.getElementById('p8e-val')?.value;
  const from = document.getElementById('p8e-sel')?.value;
  const pf = Math.min(100, Math.max(1, parseFloat(document.getElementById('p8e-pf')?.value)||100)) / 100;
  const ids = ['kw','kva','hp'];
  const empty = (!valStr || isNaN(parseFloat(valStr)) || parseFloat(valStr) <= 0);
  if (empty) { ids.forEach(id=>{const e=document.getElementById('p8e-'+id);if(e){e.textContent='-';e.style.color='';autoShrinkEl(e);}}); return; }
  const val = parseFloat(valStr);
  let kw = (from==='kw') ? val : (from==='kva') ? val*pf : val*0.7457;
  const res = {kw, kva:kw/pf, hp:kw/0.7457};
  ids.forEach(id => {
    const e = document.getElementById('p8e-'+id); if (!e) return;
    e.textContent = p8Fmt(res[id]);
    e.style.color = (id===from) ? 'var(--text-secondary)' : '';
    autoShrinkEl(e);
  });
}

function p8CalcPhase() {
  const a  = parseFloat(document.getElementById('p8ph-a')?.value)||0;
  const vv = parseFloat(document.getElementById('p8ph-v')?.value)||0;
  const pf = Math.min(100,Math.max(0,parseFloat(document.getElementById('p8ph-pf')?.value)||100))/100;
  const kwEl  = document.getElementById('p8ph-kw');
  const kvaEl = document.getElementById('p8ph-kva');
  if (a>0 && vv>0) {
    const mult = p8PhaseMode==='3' ? 1.732 : 1;
    if(kwEl) { kwEl.textContent=p8Fmt(mult*a*vv*pf/1000); autoShrinkEl(kwEl); }
    if(kvaEl){ kvaEl.textContent=p8Fmt(mult*a*vv/1000);   autoShrinkEl(kvaEl); }
  } else {
    if(kwEl) { kwEl.textContent='-'; autoShrinkEl(kwEl); }
    if(kvaEl){ kvaEl.textContent='-'; autoShrinkEl(kvaEl); }
  }
}

function injectCopyBtns() {
  document.querySelectorAll('#dynamic-content .card-header').forEach(function(header) {
    if (header.querySelector('.btn-save')) return;
    const card = header.closest('.card');
    if (!card || !card.id || card.id.startsWith('card-p8')) return;
    const btnSave = document.createElement('button');
    btnSave.className = 'btn-save';
    btnSave.textContent = '이력 생성';
    btnSave.onclick = function() { showCopyPopup(card.id, true); };
    header.appendChild(btnSave);
  });
}

function _buildPopup(title, actionFn, actionLabel) {
  const ex = document.getElementById('copy-popup');
  if (ex) ex.remove();
  const overlay = document.createElement('div');
  overlay.id = 'copy-popup';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:10000;background:rgba(0,0,0,0.5);display:flex;align-items:flex-start;justify-content:center;padding:80px 20px 20px;';
  overlay.innerHTML = `<div class="popup-inner"><div class="popup-title">${title}</div><input id="copy-popup-input" class="popup-input" type="text" placeholder="국소명 입력 (선택)"><div class="popup-actions"><button class="popup-btn-cancel" onclick="closeCopyPopup()">취소</button><button class="popup-btn-ok" onclick="${actionFn}">${actionLabel}</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) closeCopyPopup(); });
  setTimeout(function(){ document.getElementById('copy-popup-input')?.focus(); }, 50);
}

function showCopyPopup(cardId, isSave) {
  const fn = isSave ? "execSave('"+cardId+"')" : "execCopy('"+cardId+"')";
  const label = isSave ? '이력 생성' : '결과 복사';
  _buildPopup('국소명 입력', fn, label);
}

function closeCopyPopup() {
  const popup = document.getElementById('copy-popup');
  if (!popup) return;
  popup.remove();
}

function buildText(cardId, locationText) {
  const card = document.getElementById(cardId);
  if (!card) return '';
  const lines = [];
  const now = new Date();
  const ts = now.getFullYear().toString().slice(2)
    + '.' + String(now.getMonth()+1).padStart(2,'0')
    + '.' + String(now.getDate()).padStart(2,'0')
    + ' ' + String(now.getHours()).padStart(2,'0')
    + ':' + String(now.getMinutes()).padStart(2,'0');
  if (locationText) lines.push(locationText);
  lines.push(ts);
  const pageTitle = document.getElementById('nav-title')?.textContent || '';
  const cardTitle = card.querySelector('.card-header h2')?.textContent?.trim() || '';
  if (pageTitle) lines.push('[' + pageTitle + ']');
  const activeTab = card.querySelector('.tab-btn.active, .seg-btn.active');
  const tabText = activeTab ? ' ' + activeTab.textContent.trim() : '';
  if (cardTitle) lines.push(cardTitle + tabText);
  const inputLines = [];
  card.querySelectorAll('.input-col').forEach(function(col) {
    if (col.offsetParent === null) return;
    const label = col.querySelector('label');
    const input = col.querySelector('input');
    const sel   = col.querySelector('select');
    if (!label) return;
    let val = '-';
    if (input) val = input.value !== '' ? input.value : '-';
    else if (sel) val = sel.options[sel.selectedIndex]?.text || '-';
    inputLines.push(label.textContent.trim() + ' : ' + val);
  });
  if (inputLines.length) { lines.push(''); inputLines.forEach(function(l){ lines.push(l); }); }
  const resultLines = [];
  card.querySelectorAll('.result-row').forEach(function(row) {
    if (row.offsetParent === null) return;
    const lbls = row.querySelectorAll('.result-label');
    const vals = row.querySelectorAll('.result-value');
    lbls.forEach(function(lbl, i) {
      const val = vals[i]?.textContent?.trim() || '-';
      resultLines.push(lbl.textContent.trim() + ' : ' + val);
    });
  });
  if (resultLines.length) { lines.push(''); resultLines.forEach(function(l){ lines.push(l); }); }
  return lines.join('\n').trim();
}

function execSave(cardId) {
  const loc = (document.getElementById('copy-popup-input')?.value || '').trim();
  closeCopyPopup();
  const text = buildText(cardId, loc);
  if (!text) return;

  const texts = _loadHistFromStorage(cardId);
  texts.unshift(text);
  if (texts.length > 10) texts.pop();
  _saveHistToStorage(cardId, texts);

  if (document.getElementById('sidebar')?.classList.contains('open')) renderSidebar();
  showToast('저장 완료');
}

function execCopy(cardId) {
  const loc = (document.getElementById('copy-popup-input')?.value || '').trim();
  closeCopyPopup();
  const text = buildText(cardId, loc);
  if (!text) return;
  navigator.clipboard.writeText(text).then(function() {
    showToast('결과 복사');
  }).catch(function() {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('결과 복사');
  });
}

function _histKey(cardId) { return 'hist_' + cardId; }

function _saveHistToStorage(cardId, texts) {
  try { localStorage.setItem(_histKey(cardId), JSON.stringify(texts)); } catch(e) { if (!(e instanceof DOMException)) throw e; }
}

function _loadHistFromStorage(cardId) {
  try { const v = localStorage.getItem(_histKey(cardId)); return v ? JSON.parse(v) : []; } catch(e) { if (e instanceof SyntaxError || e instanceof DOMException) return []; throw e; }
}


function openSidebar() {
  renderSidebar();
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeSidebar() {
  _closeSidebarDirect();
}

function _closeSidebarDirect() {
  document.getElementById('sidebar')?.classList.remove('open');
  document.getElementById('sidebar-overlay')?.classList.remove('open');
  document.body.style.overflow = '';
}

function renderSidebar() {
  const body = document.getElementById('sidebar-body');
  if (!body) return;
  const cats = ['p1','p2','p3','p4','p5','p6','p7'].map(function(pid) {
    const cardIds = PAGE_CARDS[pid] || [];
    const allItems = [];
    cardIds.forEach(function(cid) {
      _loadHistFromStorage(cid).forEach(function(text, idx) {
        allItems.push({ cardId: cid, text: text, cardIdx: idx });
      });
    });
    return { pid: pid, count: allItems.length, allItems: allItems };
  }).filter(function(cat) { return cat.count > 0; });

  if (cats.length === 0) {
    body.innerHTML = '<div class="sidebar-empty" style="padding:24px 16px;text-align:center;">저장된 이력이 없습니다.</div>';
    return;
  }

  body.innerHTML = cats.map(function(cat) {
    const pid = cat.pid, allItems = cat.allItems, count = cat.count;
    const title = pageTitles[pid] || pid;
    const clearBtn = '<button class="sidebar-cat-clear" onclick="event.stopPropagation();sidebarClearCat(\''+pid+'\')">전체삭제</button>';
    const chevron = '<svg class="sidebar-cat-chevron" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const itemsHTML = allItems.map(function(item) {
      const safe = item.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return '<div class="sidebar-hist-item" data-card-id="'+item.cardId+'" data-card-idx="'+item.cardIdx+'">'
        +'<div class="sidebar-hist-text">'+safe+'</div>'
        +'<div class="sidebar-hist-actions">'
        +'<button class="sidebar-hist-copy" onclick="sidebarCopyItem(this)">결과 복사</button>'
        +'<button class="sidebar-hist-del" onclick="sidebarDelItem(this)">삭제</button>'
        +'</div></div>';
    }).join('');
    return '<div class="sidebar-cat">'
      +'<div class="sidebar-cat-header" data-pid="'+pid+'" onclick="toggleSidebarCat(this)">'
      +'<span>'+title+'</span>'
      +'<span class="sidebar-cat-meta">'+clearBtn+'<span class="sidebar-cat-count">'+count+'</span>'+chevron+'</span></div>'
      +'<div class="sidebar-cat-body">'+itemsHTML+'</div>'
      +'</div>';
  }).join('');
}

function toggleSidebarCat(header) {
  const isOpen = header.classList.toggle('open');
  const body = header.nextElementSibling;
  if (body) body.classList.toggle('open', isOpen);
}

function sidebarCopyItem(btn) {
  const item = btn.closest('.sidebar-hist-item');
  if (!item) return;
  const texts = _loadHistFromStorage(item.dataset.cardId);
  const text = texts[parseInt(item.dataset.cardIdx)] || '';
  if (!text) return;
  navigator.clipboard.writeText(text).then(function() {
    showToast('결과 복사');
  }).catch(function() {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('결과 복사');
  });
}

function sidebarDelItem(btn) {
  const item = btn.closest('.sidebar-hist-item');
  if (!item) return;
  const cardId = item.dataset.cardId;
  const idx = parseInt(item.dataset.cardIdx);
  if (!cardId || isNaN(idx)) return;
  const pid = Object.keys(PAGE_CARDS).find(function(p) { return (PAGE_CARDS[p] || []).indexOf(cardId) >= 0; });
  const openPids = Array.from(document.querySelectorAll('.sidebar-cat-header.open')).map(function(h) { return h.dataset.pid; });
  const texts = _loadHistFromStorage(cardId);
  texts.splice(idx, 1);
  _saveHistToStorage(cardId, texts);
  showToast('삭제 완료');
  renderSidebar();
  openPids.forEach(function(p) {
    const h = document.querySelector('.sidebar-cat-header[data-pid="'+p+'"]');
    if (h) { h.classList.add('open'); const b = h.nextElementSibling; if (b) b.classList.add('open'); }
  });
  if (pid && openPids.indexOf(pid) < 0) {
    const h = document.querySelector('.sidebar-cat-header[data-pid="'+pid+'"]');
    if (h) { h.classList.add('open'); const b = h.nextElementSibling; if (b) b.classList.add('open'); }
  }
}

function sidebarClearCat(pid) {
  (PAGE_CARDS[pid] || []).forEach(function(cid) { _saveHistToStorage(cid, []); });
  showToast('전체 삭제');
  renderSidebar();
}

let _toastTimer = null;
function showToast(msg) {
  const ex = document.getElementById('toast');
  if (ex) ex.remove();
  clearTimeout(_toastTimer);
  const el = document.createElement('div');
  el.id = 'toast';
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(function() { el.classList.add('show'); });
  _toastTimer = setTimeout(function() {
    el.classList.remove('show');
    setTimeout(function() { el.remove(); }, 250);
  }, 2000);
}

// 확대/축소 차단 (Ctrl+휠, Ctrl +/-/0, 트랙패드 핀치)
window.addEventListener('wheel', function(e) {
  if (e.ctrlKey) e.preventDefault();
}, { passive: false });
window.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && ['+', '=', '-', '_', '0'].includes(e.key)) e.preventDefault();
});
['gesturestart', 'gesturechange', 'gestureend'].forEach(function(t) {
  document.addEventListener(t, function(e) { e.preventDefault(); });
});

</script>
